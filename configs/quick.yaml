# Quick run: same code, same protocol, smaller everything.
#
# Target: `bash run_all.sh --quick` finishes in under 15 minutes on a laptop,
# including figures and tables. It uses the first 100K vectors of each dataset
# (ground truth recomputed exactly for the subset, and cached), one build
# configuration per index, a coarse parameter grid, and a single timing repeat
# with a short budget.
#
# Quick numbers are NOT the numbers in the report. They exist to prove the
# pipeline runs end to end.

name: quick
seed: 42
k: 10
tune_queries: 1000
verify_queries: 500   # queries used for the ground-truth check against the FULL database
test_queries: 1000

timing:
  repeats: 1
  warmup: true
  max_timed_queries: 500
  min_timed_queries: 100
  time_budget_s: 3.0
  check_every: 16
  time_on: tune

build:
  threads: 0

datasets:
  sift:
    path: data/sift-128-euclidean.hdf5
    normalize: false
    n_vectors: 100000
  glove:
    path: data/glove-100-angular.hdf5
    normalize: true
    n_vectors: 100000

part2:
  stop_above_recall: 0.98
  hnsw:
    M: [16]
    ef_construction: 100
    ef_search: [10, 20, 40, 80, 160]
  ivfflat:
    nlist: [1024]
    nprobe: [1, 4, 16, 64, 128]
  ivfpq:
    m:
      sift: [16]
      glove: [20]
    nlist: [1024]
    nbits: 8
    nprobe: [1, 4, 16, 64, 128]
    refine: true
    refine_k: 100

part3:
  dataset: sift
  sizes: [25000, 50000, 100000]
  nlist_multiplier: 4.0
  hnsw:
    M: 16
    ef_construction: 100
  ef_search: [10, 40, 160]
  nprobe: [1, 4, 16, 64]
  stop_above_recall: 0.98

part4:
  n: 20000
  n_queries: 400
  dim: 128
  # Noise norm as a FRACTION of the signal norm. Signal power is held at 1
  # for every k_intrinsic, so this means the same thing in every condition.
  # (Was `noise`, a per-coordinate sigma, which made the signal-to-noise
  # ratio vary 8x across conditions and confounded the experiment.)
  noise_frac: 0.05
  k_intrinsic: [2, 8, 32, 128]
  # Measure exact search in each condition too, so "the approximate index
  # is slower than brute force" is a measurement rather than an inference.
  exact_baseline: true
  contrast_sample: 5000
  stop_above_recall: 0.98
  # The grid reaches further here than elsewhere in quick mode: at k_intrinsic
  # = 128 (the control) the recall target is genuinely hard, and a sweep that
  # stops short would show every index "not reaching 0.95" for want of
  # searching rather than for the reason under study.
  hnsw:
    M: [16]
    ef_construction: 100
    ef_search: [10, 40, 160, 400, 800]
  ivfflat:
    nlist: [256]
    nprobe: [1, 4, 16, 64, 128, 256]
  ivfpq:
    m: [16]
    nlist: [256]
    nbits: 8
    nprobe: [1, 4, 16, 64, 128, 256]
